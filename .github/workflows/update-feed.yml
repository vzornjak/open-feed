name: Osvježi osobne RSS feedove

on:
  workflow_dispatch:
  push:
    paths:
      - "generate_feed.py"
      - "feeds.json"
      - "test_generate_feed.py"
      - ".github/workflows/update-feed.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: osobni-feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testovi
        run: python -m unittest -v
      - name: Izradi RSS
        run: python generate_feed.py
      - name: Spremi promjene
        run: |
          if [ -z "$(git status --porcelain -- '*.xml' data/)" ]; then
            echo "Nema novih emisija."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.xml' data/
          git commit -m "Automatski osvježi osobne RSS feedove"
          git push
